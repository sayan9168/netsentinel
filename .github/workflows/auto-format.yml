name: AOXNet Auto Format

on:
  push:
    branches: [fix/aoxnet-gofmt-features]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format Go sources
        run: gofmt -w .
      - name: Commit formatting changes
        run: |
          if git diff --quiet -- '*.go'; then
            echo 'Go sources already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.go'
          git commit -m 'style: format Go sources with gofmt'
          git push --force-with-lease origin HEAD:fix/aoxnet-gofmt-features
