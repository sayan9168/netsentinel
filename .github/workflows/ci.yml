name: AOXNet CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22.x', '1.23.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race test
        run: go test -race ./... -count=1
      - name: Build
        run: go build ./...
      - name: Fuzz smoke test
        run: go test ./aoxnet -run '^$' -fuzz=FuzzDecodeNeverPanics -fuzztime=10s
      - name: Benchmark compile
        run: go test ./aoxnet -run '^$' -bench . -benchmem
